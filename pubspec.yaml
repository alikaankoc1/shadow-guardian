name: shadow_guardian
description: "Shadow Guardian — a gentle 2D children's game built with Flutter and Flame."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.38.2
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFE8E0"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#EAF8FF"
  image: assets/branding/splash.png
  android: true
  ios: true
  android_12:
    color: "#EAF8FF"
    image: assets/branding/splash.png
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/branding/
    - assets/game/nature/
    - assets/game/vehicles/
    - assets/game/fruits/
    - assets/game/animals/
    - assets/game/professions/
    - assets/game/ocean/
    - assets/game/space/
    - assets/game/fairy_tale/
    - assets/game/surprise/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VariableFont.ttf
