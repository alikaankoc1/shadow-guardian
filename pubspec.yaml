name: shadow_guardian
description: "Sevimli Gölgeler — çocuklar için gölge eşleştirme oyunu (Flutter + Flame)."
publish_to: 'none'

# versionName+versionCode — bump versionCode for every Play upload.
version: 1.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flame: ^1.38.2
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFE8E0"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#EAF8FF"
  image: assets/branding/splash.png
  android: true
  ios: true
  android_12:
    color: "#EAF8FF"
    image: assets/branding/splash.png
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/audio/bgm.mp3
    - assets/audio/sfx_correct.mp3
    - assets/audio/sfx_wrong.mp3
    - assets/branding/
    - assets/game/nature/
    - assets/game/vehicles/
    - assets/game/fruits/
    - assets/game/animals/
    - assets/game/professions/
    - assets/game/ocean/
    - assets/game/space/
    - assets/game/fairy_tale/
    - assets/game/surprise/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VariableFont.ttf
